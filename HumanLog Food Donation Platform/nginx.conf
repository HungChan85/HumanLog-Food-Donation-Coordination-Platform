server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/donor/ { proxy_pass http://donor:5001; }
    location /api/requester/ { proxy_pass http://requester:5002; }
    location /api/ { proxy_pass http://coordinator:5000; }
    location /internal/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}

